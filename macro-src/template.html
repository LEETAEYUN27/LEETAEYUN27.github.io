<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>글로벌 경제 관제실</title>
<meta name="description" content="지수·원자재·환율·섹터·기관 13F·금리 시나리오·경제 안정성·부동산을 한 화면에서 보는 거시 대시보드">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f4f3ef; --panel:#fbfaf7; --panel-2:#eeece6; --line:#dedbd2; --line-soft:#e7e4dc;
  --ink:#14181c; --ink-2:#4d5760; --ink-3:#7b858e;
  --gold:#9a6f14; --gold-soft:#d8b25a; --blue:#2a78d6; --violet:#4a3aa7;
  --up:#0e8a5f; --down:#c93a39; --warn:#b07500;
  --grid:#e2dfd6;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101317; --panel:#171b21; --panel-2:#1e242b; --line:#2b323b; --line-soft:#232931;
    --ink:#eef1f5; --ink-2:#a3aeb9; --ink-3:#78848f;
    --gold:#e0a33c; --gold-soft:#8a6a24; --blue:#3987e5; --violet:#9085e9;
    --up:#25b37c; --down:#e66767; --warn:#d99a1f;
    --grid:#252c34;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101317; --panel:#171b21; --panel-2:#1e242b; --line:#2b323b; --line-soft:#232931;
  --ink:#eef1f5; --ink-2:#a3aeb9; --ink-3:#78848f;
  --gold:#e0a33c; --gold-soft:#8a6a24; --blue:#3987e5; --violet:#9085e9;
  --up:#25b37c; --down:#e66767; --warn:#d99a1f;
  --grid:#252c34;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 72px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

/* ── 헤더 ─────────────────────────────────────── */
header{border-bottom:1px solid var(--line);background:var(--panel);position:relative}
.hd{max-width:1280px;margin:0 auto;padding:22px 96px 0 20px;
    display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.brand{flex:1 1 320px;min-width:280px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
         color:var(--gold);margin-bottom:6px}
.brand h1{font-size:27px;letter-spacing:-.02em}
.brand p{margin:6px 0 0;color:var(--ink-2);font-size:13px;max-width:60ch;text-wrap:pretty}
.hd-gauge{flex:0 0 auto;display:flex;gap:22px;align-items:center;padding-bottom:4px}
.gauge-txt .g-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
                    text-transform:uppercase;color:var(--ink-3)}
.gauge-txt .g-val{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1.05}
.gauge-txt .g-sub{font-size:12px;color:var(--ink-2)}
.stamp{font-family:var(--mono);font-size:11px;color:var(--ink-3);
       max-width:1280px;margin:0 auto;padding:10px 20px 0}
nav{max-width:1280px;margin:0 auto;padding:14px 20px 0;display:flex;gap:2px;flex-wrap:wrap}
nav button{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-2);
  background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
nav button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

/* ── 섹션/패널 ────────────────────────────────── */
section{padding-top:30px}
section[hidden]{display:none}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:16px;letter-spacing:-.01em}
.sec-h .note{font-size:12px;color:var(--ink-3)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}

/* ── 시세 카드 ────────────────────────────────── */
.tile{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 13px 8px;
      text-align:left;cursor:pointer;font:inherit;color:inherit;display:block;width:100%;
      transition:border-color .12s}
.tile:hover{border-color:var(--gold-soft)}
.tile:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.tile .t-n{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.tile .t-n span:last-child{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.tile .t-v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
.tile .t-c{font-family:var(--mono);font-size:12px;display:flex;gap:10px;margin-top:1px}
.spark{display:block;margin-top:6px}

/* ── 표 ───────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
   color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow-x:auto}
.bar-cell{position:relative;min-width:120px}
.bar-cell i{position:absolute;left:0;top:50%;transform:translateY(-50%);height:14px;
            background:var(--gold-soft);opacity:.4;border-radius:2px}
.bar-cell b{position:relative;font-family:var(--mono);font-weight:500;font-size:12px;padding-left:4px}

/* ── 히트맵 ───────────────────────────────────── */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:2px}
.cell{padding:10px 11px;border-radius:3px;cursor:pointer;border:0;font:inherit;text-align:left;
      color:#fff;display:block}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cell .c-n{font-size:12px;font-weight:500;opacity:.95}
.cell .c-v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px}

/* ── 게이지/막대 ──────────────────────────────── */
.meter{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;border-radius:4px;min-width:3px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
    border-bottom:1px solid var(--line-soft);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono);font-weight:500}
.pad{padding:14px 15px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
      padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2)}
.pill.on{border-color:var(--down);color:var(--down)}
.pill.ok{border-color:var(--up);color:var(--up)}

/* ── 모달 ─────────────────────────────────────── */
.modal{position:fixed;inset:0;background:rgba(8,10,13,.55);display:flex;align-items:center;
       justify-content:center;padding:20px;z-index:50}
.modal[hidden]{display:none!important}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:6px;
       box-shadow:0 24px 60px rgba(0,0,0,.32);max-width:940px;width:100%;max-height:90vh;
       overflow:auto;padding:20px 22px 22px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.sheet-h h3{font-size:19px}
.rng{display:flex;gap:2px;margin:14px 0 4px}
.rng button{font-family:var(--mono);font-size:11.5px;padding:5px 11px;border:1px solid var(--line);
  background:none;color:var(--ink-2);cursor:pointer;border-radius:3px}
.rng button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);border-color:var(--gold-soft)}
.close{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:3px;
       padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:12px}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);
     border-radius:3px;padding:6px 9px;font-family:var(--mono);font-size:11.5px;z-index:60;
     box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap}
.tip[hidden]{display:none}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
      font-size:12px;color:var(--ink-3);max-width:80ch}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
     color:var(--ink-3)}
.split{display:grid;gap:10px;grid-template-columns:1.35fr 1fr}
@media (max-width:860px){.split{grid-template-columns:1fr}.hd-gauge{width:100%}}

/* ── v2 추가 ─────────────────────────────────── */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type="search"]{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);
  border-radius:3px;background:var(--panel);color:var(--ink);min-width:220px}
.toolbar input:focus-visible{outline:2px solid var(--blue);outline-offset:-1px}
.ghost{font-family:var(--mono);font-size:11.5px;padding:6px 11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);cursor:pointer;border-radius:3px}
.ghost:hover{border-color:var(--gold-soft);color:var(--ink)}
.ghost[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);border-color:var(--gold-soft)}
.theme-btn{position:absolute;top:16px;right:20px;z-index:2}
@media (max-width:860px){.hd{padding-right:20px}.theme-btn{top:auto;bottom:-40px}}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 2px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:var(--panel-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:8px 0 0}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.fresh{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fresh span{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:99px;
  border:1px solid var(--line);color:var(--ink-3)}
.fresh span.stale{border-color:var(--warn);color:var(--warn)}
.matrix{border-collapse:separate;border-spacing:2px;font-family:var(--mono);font-size:11px}
.matrix td{padding:5px 6px;text-align:center;border:0;border-radius:2px;color:#fff}
.matrix th{padding:4px 6px;font-size:10.5px;border:0;color:var(--ink-3);white-space:nowrap}
.matrix th.row{text-align:right}
.rank{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.rank .rk{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:20px}
.rank .nm{flex:1}
.rank .bs{display:flex;gap:3px}
.rank .bs i{width:26px;height:6px;border-radius:2px;background:var(--panel-2)}
.rank .bs i.on{background:var(--gold-soft)}
.sortable th{cursor:pointer;user-select:none}
.sortable th[aria-sort]{color:var(--gold)}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}

</style>
</head>
<body>
<header>
  <button class="ghost theme-btn" id="theme" title="라이트/다크 전환">◐ 테마</button>
  <div class="hd">
    <div class="brand">
      <div class="eyebrow">Global Macro Console</div>
      <h1>글로벌 경제 관제실</h1>
      <p>지수·원자재·환율·섹터·기관 보유·부동산·이벤트를 한 화면에서 본다. 타일을 누르면 연도별 추이가 열린다.</p>
      <div class="fresh" id="fresh"></div>
    </div>
    <div class="hd-gauge">
      <svg id="gauge" width="132" height="80" viewBox="0 0 132 80" aria-hidden="true"></svg>
      <div class="gauge-txt">
        <div class="g-label">경제 안정성</div>
        <div class="g-val" id="stab-score">–</div>
        <div class="g-sub" id="stab-label">–</div>
      </div>
    </div>
  </div>
  <div class="stamp" id="stamp"></div>
  <nav id="nav" role="tablist"></nav>
</header>
<div class="wrap" id="main"><p style="padding:40px 0;color:var(--ink-3)" id="boot">데이터를 불러오는 중…</p></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="tip" id="tip" hidden></div>
<script>window.__DATA__=/*__DATA__*/;</script>
<script>
/* 글로벌 경제 관제실 — 프런트엔드 (의존성 없음) */
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(v,d)=>v==null?'–':Number(v).toLocaleString('ko-KR',{minimumFractionDigits:d??2,maximumFractionDigits:d??2});
const pct=v=>v==null?'–':(v>0?'+':'')+v.toFixed(2)+'%';
const cls=v=>v==null?'':(v>0?'up':(v<0?'down':''));
const dec=v=>v==null?2:(Math.abs(v)>=1000?0:(Math.abs(v)>=100?1:(Math.abs(v)>=1?2:4)));
let D=null;

/* ── 테마 ───────────────────────────────────── */
try{const t=localStorage.getItem('gmc-theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
$('#theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':(cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('gmc-theme',next);}catch(e){}
  render();
};

/* ── 차트 ───────────────────────────────────── */
function spark(series,w,h,color){
  if(!series||series.length<2)return '';
  const v=series.map(p=>p[1]),mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
  const pts=v.map((y,i)=>[i/(v.length-1)*w,h-2-((y-mn)/r)*(h-4)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const id='g'+Math.random().toString(36).slice(2,8);
  return `<svg class="spark" width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${color}" stop-opacity=".26"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.2" fill="${color}"/></svg>`;
}
/* 다중 시리즈 라인차트 + 크로스헤어 */
function lineChart(host,seriesList,opts={}){
  const W=880,H=opts.h||300,PL=56,PR=16,PT=14,PB=26;
  seriesList=seriesList.filter(s=>s.data&&s.data.length>1);
  if(!seriesList.length){host.innerHTML='<p style="color:var(--ink-3)">데이터 없음</p>';return;}
  const labels=seriesList[0].data.map(p=>p[0]);
  let mn=Infinity,mx=-Infinity;
  seriesList.forEach(s=>s.data.forEach(p=>{if(p[1]<mn)mn=p[1];if(p[1]>mx)mx=p[1];}));
  const pad=(mx-mn)*0.08||1; mn-=pad; mx+=pad;
  const n=Math.max(...seriesList.map(s=>s.data.length));
  const X=i=>PL+i/(n-1)*(W-PL-PR), Y=y=>PT+(1-(y-mn)/(mx-mn))*(H-PT-PB);
  const tv=[0,1,2,3,4].map(i=>mn+(mx-mn)*i/4);
  let g='';
  tv.forEach(t=>{g+=`<line x1="${PL}" y1="${Y(t).toFixed(1)}" x2="${W-PR}" y2="${Y(t).toFixed(1)}" stroke="${css('--grid')}" stroke-width="1"/>
    <text x="${PL-8}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="${css('--ink-3')}" font-family="IBM Plex Mono,monospace">${fmt(t,dec(t))}${opts.suffix||''}</text>`;});
  const step=Math.max(1,Math.floor(n/7));
  for(let i=0;i<n;i+=step)
    g+=`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="${css('--ink-3')}" font-family="IBM Plex Mono,monospace">${labels[i]||''}</text>`;
  seriesList.forEach((s,k)=>{
    const d=s.data.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
    if(seriesList.length===1) g+=`<path d="${d} L${X(n-1).toFixed(1)} ${H-PB} L${PL} ${H-PB} Z" fill="${s.color}" opacity=".10"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
  });
  host.innerHTML=`<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" style="display:block"><title>${opts.title||''}</title>${g}
    <line id="ch" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="${css('--ink-3')}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    ${seriesList.map((s,k)=>`<circle class="cd" data-k="${k}" r="3.4" fill="${s.color}" stroke="${css('--panel')}" stroke-width="2" opacity="0"/>`).join('')}
    </svg>`;
  if(seriesList.length>1){
    const lg=el('div','legend',seriesList.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join(''));
    host.appendChild(lg);
  }
  const svg=host.querySelector('svg'),tip=$('#tip'),ch=svg.querySelector('#ch'),cds=$$('.cd',svg);
  svg.addEventListener('mousemove',e=>{
    const b=svg.getBoundingClientRect(),sx=(e.clientX-b.left)/b.width*W;
    if(sx<PL||sx>W-PR){ch.style.opacity=0;cds.forEach(c=>c.style.opacity=0);tip.hidden=true;return;}
    const i=Math.max(0,Math.min(n-1,Math.round((sx-PL)/(W-PL-PR)*(n-1))));
    ch.setAttribute('x1',X(i));ch.setAttribute('x2',X(i));ch.style.opacity=1;
    let txt=labels[i]||'';
    seriesList.forEach((s,k)=>{
      const p=s.data[i]; const c=cds[k]; if(!p){c.style.opacity=0;return;}
      c.setAttribute('cx',X(i));c.setAttribute('cy',Y(p[1]));c.style.opacity=1;
      txt+=`   ${seriesList.length>1?s.name+' ':''}${fmt(p[1],dec(p[1]))}${opts.suffix||''}`;
    });
    tip.hidden=false;tip.textContent=txt;
    tip.style.left=Math.min(innerWidth-260,e.clientX+12)+'px';tip.style.top=(e.clientY-34)+'px';
  });
  svg.addEventListener('mouseleave',()=>{ch.style.opacity=0;cds.forEach(c=>c.style.opacity=0);tip.hidden=true;});
}

/* ── 상세 모달 ──────────────────────────────── */
function openDetail(item){
  const m=$('#modal'),s=$('#sheet');
  const up=item.chg&&item.chg.d1>0;
  const hi=item.hi52,lo=item.lo52;
  const posPct=(hi!=null&&lo!=null&&hi>lo)?((item.last-lo)/(hi-lo)*100):null;
  s.innerHTML=`<div class="sheet-h">
      <div><div class="tag">${item.ticker}</div><h3>${item.name}</h3>

function tile(item){
  const b=el('button','tile');

  b.innerHTML=`<div class="t-n"><span>${item.name}</span><span>${item.ticker}</span></div>
    <div class="t-v">${fmt(item.last,dec(item.last))}</div>
    <div class="t-c"><span class="${cls(item.chg?item.chg.d1:null)}">${pct(item.chg?item.chg.d1:null)}</span>
      <span style="color:var(--ink-3)">YTD ${pct(item.ytd)}</span></div>
    ${spark(item.daily.slice(-120),200,34,c)}`;
  b.onclick=()=>openDetail(item); return b;
}
const tileGrid=items=>{const g=el('div','grid g4');items.forEach(i=>g.appendChild(tile(i)));return g;};
function heat(items,key){
  const g=el('div','heat');
  const mx=Math.max(1,...items.map(i=>Math.abs(i.chg[key]??0)));
  items.forEach(i=>{
    const v=i.chg[key],t=v==null?0:Math.max(-1,Math.min(1,v/mx));
    const base=t>=0?[14,138,95]:[201,58,57], a=0.16+Math.abs(t)*0.72;
    const b=el('button','cell');
    b.style.background=`rgba(${base.join(',')},${a.toFixed(2)})`;
    b.style.color=Math.abs(t)>0.45?'#fff':css('--ink');
    b.innerHTML=`<div class="c-n">${i.name}</div><div class="c-v">${pct(v)}</div>`;
    b.onclick=()=>openDetail(i); g.appendChild(b);
  });
  return g;
}

function gauge(score){
  const g=$('#gauge'),R=52,cx=66,cy=66;
  const arc=(a0,a1,col,w)=>{const p=a=>[cx+R*Math.cos(Math.PI*(1-a)),cy-R*Math.sin(Math.PI*(1-a))];
    const [x0,y0]=p(a0),[x1,y1]=p(a1);
    return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="11"/>`;};
  const t=Math.max(0,Math.min(100,score))/100;
  const col=score>=70?css('--up'):score>=45?css('--warn'):css('--down');
  let s=arc(0,1,css('--panel-2'))+arc(0,Math.max(0.008,t),col);
  const a=Math.PI*(1-t),nx=cx+(R-16)*Math.cos(a),ny=cy-(R-16)*Math.sin(a);
  s+=`<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${css('--ink')}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="3" fill="${css('--ink')}"/>`;
  g.innerHTML=s;
  $('#stab-score').textContent=Math.round(score); $('#stab-score').style.color=col;
  $('#stab-label').textContent=D.stability.label;
}

      <div style="font-size:12px;color:var(--ink-3);margin-top:3px">${c.detail}</div></div>`).join('')}`;
  const right=el('div','panel pad');
  right.innerHTML=`<div class="tag">핵심 지표</div>
    ${D.stability.metrics.map(m=>`<div class="kv"><span>${m.name}</span><b>${m.value}</b></div>`).join('')}
    <div style="margin-top:12px;font-size:12.5px;color:var(--ink-2)">${D.stability.comment}</div>`;
  sp.appendChild(left);sp.appendChild(right);s.appendChild(sp);
  if(D.stability.recession_series){
    s.appendChild(secHead('뉴욕연준 12개월 침체확률','국채 수익률곡선 기반 · 월별 · 각 시점은 12개월 뒤를 예측한 값'));
    const c=el('div','panel pad');s.appendChild(c);
    lineChart(c,[{name:'침체확률',color:css('--violet'),data:D.stability.recession_series}],{suffix:'%'});
  }
  if(D.macro_series&&D.macro_series.length){
    s.appendChild(secHead('거시 지표 추이',''));
    const g=el('div','grid g2');
    D.macro_series.forEach(m=>{
      const p=el('div','panel pad');
      p.innerHTML=`<div class="tag">${m.source}</div><h3 style="font-size:14px;margin:2px 0">${m.label}</h3>
        <div class="num" style="font-size:19px;font-weight:600">${fmt(m.last,dec(m.last))}${m.unit||''}
          <span style="font-size:12px;color:var(--ink-3)">기준 ${m.asof}</span></div><div class="mc"></div>`;
      g.appendChild(p);
    });
    s.appendChild(g);
    D.macro_series.forEach((m,i)=>lineChart(g.children[i].querySelector('.mc'),
      [{name:m.label,color:css('--blue'),data:m.series}],{h:200,suffix:m.unit||''}));
  }
}],
['realestate','부동산·리츠',s=>{
  s.appendChild(secHead('리츠 (미국·한국)','타일을 누르면 연도별 추이'));
  s.appendChild(tileGrid(D.groups.realestate));
  if(D.housing&&D.housing.length){
    s.appendChild(secHead('주택가격 지수',''));
    const g=el('div','grid g2');
    D.housing.forEach(h=>{
      const p=el('div','panel pad');
      p.innerHTML=`<div class="tag">${h.source}</div><h3 style="font-size:15px;margin:2px 0">${h.name}</h3>
        <div class="num" style="font-size:20px;font-weight:600">${fmt(h.last,0)}
          <span class="${cls(h.yoy)}" style="font-size:14px">전년비 ${pct(h.yoy)}</span></div>
        <div class="num" style="font-size:12px;color:var(--ink-3)">기준 ${h.asof}</div><div class="hc"></div>`;
      g.appendChild(p);
    });
    s.appendChild(g);
    D.housing.forEach((h,i)=>lineChart(g.children[i].querySelector('.hc'),
      [{name:h.name,color:css('--gold'),data:h.series}],{h:210}));
  }
  if(D.kr_housing){
    const K=D.kr_housing, regions=Object.keys(K.sale.regions);
    s.appendChild(secHead('한국 아파트 가격지수','한국부동산원 R-ONE 주간 통계 · 2021.6=100'));
    const chips=el('div','chips');
    let reg=regions.includes('서울')?'서울':regions[0];
    regions.forEach(r=>{const c=el('button','chip',r);c.dataset.r=r;
      c.setAttribute('aria-pressed',r===reg);chips.appendChild(c);});
    s.appendChild(chips);
    const cards=el('div','grid g4');s.appendChild(cards);
    const host=el('div','panel pad');s.appendChild(host);
    const paint=()=>{
      const sale=K.sale.regions[reg], je=K.jeonse.regions[reg];
      cards.innerHTML=[['매매가격지수',sale],['전세가격지수',je]].map(([t,d])=>`
        <div class="panel pad"><div class="tag">${reg} · ${t}</div>
          <div class="num" style="font-size:21px;font-weight:600">${fmt(d.last,2)}
            <span class="${cls(d.yoy)}" style="font-size:13px">전년비 ${pct(d.yoy)}</span></div>
          <div class="num" style="font-size:11.5px;color:var(--ink-3)">기준 ${d.asof}</div></div>`).join('');
      lineChart(host,[{name:'매매',color:css('--gold'),data:sale.series},
                      {name:'전세',color:css('--blue'),data:je.series}],{h:300,title:reg+' 아파트 가격지수'});
    };
    $$('button',chips).forEach(c=>c.onclick=()=>{$$('button',chips).forEach(x=>x.setAttribute('aria-pressed','false'));
      c.setAttribute('aria-pressed','true');reg=c.dataset.r;paint();});
    paint();
    s.appendChild(el('p','hint','주간 지수라 시점 라벨이 촘촘하다. 미국(Zillow·월간)과는 기준·주기가 달라 수치를 직접 비교하지 말 것.'));
  }
}],
];

/* ── 렌더 ───────────────────────────────────── */
let active=0;
function render(){
  const nav=$('#nav'),main=$('#main');
  nav.innerHTML='';main.innerHTML='';
  SECTIONS.forEach(([id,label,build],i)=>{
    const b=el('button',null,label);
    b.setAttribute('role','tab');b.setAttribute('aria-selected',i===active);
    b.onclick=()=>{active=i;render();scrollTo({top:0,behavior:'smooth'});};
    nav.appendChild(b);
    if(i!==active)return;
    const s=el('section');s.id='sec-'+id;
    try{build(s);}catch(e){s.appendChild(el('p','hint','이 섹션을 그리는 중 오류: '+e.message));}
    main.appendChild(s);
  });
  main.appendChild(el('div','foot',D.disclaimer));
  gauge(D.stability.score);
  $('#stamp').textContent=`데이터 기준 ${D.asof} · 시세 ${D.sources.prices} · 거시 ${D.sources.macro} · 기관 ${D.sources.inst}`;
  $('#fresh').innerHTML=(D.freshness||[]).map(f=>
    `<span class="${f.stale?'stale':''}">${f.name} ${f.asof}${f.stale?' ⚠':''}</span>`).join('');
}
function boot(data){D=data;render();}
if(window.__DATA__)boot(window.__DATA__);
else fetch('data/dashboard.json').then(r=>r.json()).then(boot).catch(e=>{
  $('#boot').innerHTML='데이터를 불러오지 못했습니다 — <b>run.bat</b>으로 실행하거나, 단일 파일 버전(standalone.html)을 열어 주십시오.<br><span class="hint">'+e.message+'</span>';});
})();

</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
